<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16171B"/>
      <stop offset="1" stop-color="#232A4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#B79CFF"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A65"/>
      <stop offset="1" stop-color="#C2185B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1120" cy="-40" r="260" fill="#6C7BFF" opacity="0.10"/>
  <circle cx="80" cy="460" r="220" fill="#B79CFF" opacity="0.08"/>

  <!-- Title -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="170" font-size="92" font-weight="800" fill="#ECEDF0">Widgets</text>
    <rect x="76" y="196" width="150" height="8" rx="4" fill="url(#accent)"/>
    <text x="74" y="252" font-size="25" fill="#A6ABB5">Beautiful, live home-screen widgets</text>
    <text x="74" y="288" font-size="25" fill="#A6ABB5">for Android — drawn natively,</text>
    <text x="74" y="324" font-size="25" fill="#A6ABB5">ticking in real time.</text>
  </g>

  <g transform="translate(20,12) scale(0.9)">
  <!-- Clock widget -->
  <g filter="url(#shadow)">
    <rect x="700" y="60" width="200" height="200" rx="34" fill="#1D1F24"/>
    <text x="800" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="64" font-weight="800" fill="#ECEDF0">11:50</text>
    <text x="800" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="16" fill="#8A8F99">Wednesday, 14 Oct</text>
  </g>

  <!-- Analog dial widget -->
  <g filter="url(#shadow)">
    <rect x="924" y="60" width="200" height="200" rx="34" fill="url(#sunset)"/>
    <circle cx="1024" cy="160" r="72" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
    <g stroke="#FFFFFF" stroke-linecap="round">
      <line x1="1024" y1="160" x2="1024" y2="112" stroke-width="7"/>
      <line x1="1024" y1="160" x2="1064" y2="178" stroke-width="5"/>
      <line x1="1024" y1="160" x2="992" y2="118" stroke-width="2" stroke="#FFE58F"/>
    </g>
    <circle cx="1024" cy="160" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Toggle row widget (Material Icons, Apache License 2.0) -->
  <g filter="url(#shadow)">
    <rect x="700" y="284" width="424" height="96" rx="34" fill="#1B1D22"/>
    <circle cx="757" cy="332" r="30" fill="#5E5CE6"/>
    <circle cx="861" cy="332" r="30" fill="#5E5CE6"/>
    <circle cx="965" cy="332" r="30" fill="#FFFFFF" fill-opacity="0.15"/>
    <circle cx="1069" cy="332" r="30" fill="#FFD60A"/>
    <path transform="translate(739.0,314.0) scale(1.5)" fill="#FFFFFF" d="M6,2h12v3H6zM6,7v1l2,3v11h8V11l2,-3V7H6zM12,15.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5z"/>
    <path transform="translate(843.0,314.0) scale(1.5)" fill="#FFFFFF" d="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32L13.5,4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
    <path transform="translate(947.0,314.0) scale(1.5)" fill="#A6ABB5" d="M16.48,2.52c3.27,1.55 5.61,4.72 5.97,8.48h1.5C23.44,4.84 18.29,0 12,0l-0.66,0.03 3.81,3.81 1.33,-1.32zM10.23,1.75c-0.59,-0.59 -1.54,-0.59 -2.12,0L1.75,8.11c-0.59,0.59 -0.59,1.54 0,2.12l12.02,12.02c0.59,0.59 1.54,0.59 2.12,0l6.36,-6.36c0.59,-0.59 0.59,-1.54 0,-2.12L10.23,1.75zM14.83,21.19L2.81,9.17l6.36,-6.36 12.02,12.02 -6.36,6.36zM7.52,21.48C4.25,19.94 1.91,16.76 1.55,13H0.05C0.56,19.16 5.71,24 12,24l0.66,-0.03 -3.81,-3.81 -1.33,1.32z"/>
    <path transform="translate(1051.0,314.0) scale(1.5)" fill="#1C1C1E" d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM17,13H7v-2h10v2z"/>
  </g>

  <!-- Sticky note widget -->
  <g filter="url(#shadow)">
    <rect x="1148" y="60" width="200" height="320" rx="34" fill="#FFE58F"/>
    <rect x="1170" y="84" width="74" height="28" rx="10" fill="#8A6A12"/>
    <text x="1207" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="15" font-weight="700" fill="#FFF7D6">NOTE</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2B2722">
      <text x="1170" y="150" font-weight="700">Weekend</text>
      <text x="1170" y="182">• Buy groceries</text>
      <text x="1170" y="212">☑ Call Rahul</text>
      <text x="1170" y="242">☐ Book tickets</text>
    </g>
  </g>
  </g>
</svg>
